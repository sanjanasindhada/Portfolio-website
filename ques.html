<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            text-align: center;
        }

        .card {
            box-shadow: 1px 2px 3px 1px rgb(42, 21, 21, 0.3);
            height: 200px;
            width: 300px;
            margin: 10px;
            border-radius: 10px;
        }

        /* .card:hover {
            height: 305px;
            width: 305px;
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid black;
        } */
        body {
            background-color: rgb(153, 240, 240);
        }

        button {
            border-radius: 5px;
            padding: 5px;
            border: none;
            width: 50px;
            background-color: antiquewhite;
        }

        button:hover {
            background-color: rgb(5, 234, 5);
            color: white;
        }

        .option1,
        .option2,
        .option3,
        .option4 {
            height: 25px;
            width: 250px;
            border-radius: 10px;
            background-color: darkblue;
            margin: 5px;
        }

        .option1,
        .option2,
        .option3,
        .option4 {
            color: white;
            text-align: left;
        }

        .option_card {
            position: absolute;
            top: 150px;
        }
    </style>
</head>

<body>
    <h1>🕒 Left Time <span id="timer">10:00</span></h1>
    <center>
        <div class="card">
            <div id="ques">
                <h3 id="question"></h3>
            </div><br><br><br><br><br>
            <div class="option_card">
                <div class="option1" ></div>
                <div class="option2"></div>
                <div class="option3"></div>
                <div class="option4"></div>
            </div>
        </div>
        </div>
        <button id="next">next</button>
        <button style="display: none;" id="sub" onclick="sub_btn()">submit</button>
    </center>
</body>
<script>
    var timeLeft = 10 * 60;
    let timer = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        seconds = seconds < 10 ? "0" + seconds : seconds;

        document.getElementById("timer").innerHTML = minutes + ":" + seconds;

        timeLeft--;
        if (timeLeft <= 0) {
            clearInterval(timer);
            document.getElementById("timer").innerHTML = "time up!!";
            document.getElementById("next").style.display = "none";
            document.getElementById("sub").style.display = "block";
        }
    }, 1000);
    function sub_btn() {
        let message = "";

        if (score === 0) {
            message = "👎 Bad Performance!! Better Luck Next Time 😢";
        }
        else if (score >= 1 && score <= 4) {
            message = "🙂 Good Performance!! Keep Improving 👍";
        }
        else {
            message = "🎉 Excellent Performance!!! 🔥";
        }
        var btn = document.getElementById("sub");
        document.body.innerHTML = ` <div style="text-align:center; margin-top:50px;">
        <h2>🎉 Quiz Finished</h2><h2>Your Score :- ${score} / ${questions.length}</h2>
        <h3>${message}</h3></div>`
    }
    const questions = [
        {
            question: "Q.1:-Which language is used for web page structure?",
            options: ["CSS", "HTML", "JavaScript", "Python"],
            correctIndex: 1
        },
        {
            question: "Q.2:-For validating a 10-digit mobile number, which JS code is correct??",
            options: ["if(num.length == 10)", "if(num > 10)", "if(num < 10)", "if(num.length > 12)"],
            correctIndex: 0
        },
        {
            question: "Q.3:-Which method is used to print output in console?",
            options: ["print()", "console.log()", "echo()", "printf()"],
            correctIndex: 1
        },
        {
            question: "Q.4:-Which company developed Java?",
            options: ["Microsoft", "Sun Microsystems", "Google", "Apple"],
            correctIndex: 1
        },
        {
            question: "Q.5:-Which keyword is used to declare a variable in JavaScript?",
            options: ["int", "var", "define", "dim"],
            correctIndex: 1
        },
        {
            question: "Q.6:-Which operator is used for strict equality in JavaScript?",
            options: ["==", "=", "===", "!="],
            correctIndex: 2
        },
        {
            question: "Q.7:-Which data type is NOT primitive in JavaScript?",
            options: ["String", "Number", "Boolean", "Object"],
            correctIndex: 3
        },
        {
            question: "Q.8:-Which loop is guaranteed to execute at least once?",
            options: ["for", "while", "do...while", "foreach"],
            correctIndex: 2
        },
        {
            question: "Q.9:-To create a 10-minute countdown timer, which of the following JS methods is used?",
            options: ["setInterval()", "setTimeout()", "clearInterval()", "setTime()"],
            correctIndex: 1
        },
        {
            question: "Q.10:-Which function converts JSON to object?",
            options: ["JSON.parse()", "JSON.stringify()", "JSON.object()", "JSON.convert()"],
            correctIndex: 0
        }
    ];

    let currentIndex = 0;
    var score = 0;
    function questionsload() {
        let q = questions[currentIndex];
        document.getElementById("question").innerHTML = q.question;

        document.querySelector(".option1").innerHTML =
            `<input type = "radio" name = "option" value = "0" > ${q.options[0]} `;
        document.querySelector(".option2").innerHTML =
            `<input type = "radio" name = "option" value = "1" > ${q.options[1]} `;
        document.querySelector(".option3").innerHTML =
            `<input type = "radio" name = "option" value = "2" > ${q.options[2]} `;
        document.querySelector(".option4").innerHTML =
            `<input type = "radio" name = "option" value = "3" > ${q.options[3]} `;
    }

    document.getElementById("next").addEventListener("click", function () {
        var selected = document.querySelector(`input[name = "option"]:checked`);
        if (!selected) {
            alert("Please select an option!");
            return;
        }
        if (parseInt(selected.value) === questions[currentIndex].correctIndex) {
            score++;
        }
        currentIndex++;

        if (currentIndex < questions.length) {
            questionsload()
        }
        else {
            clearInterval(timer);
            document.getElementById("next").style.display = "none";
            document.getElementById("sub").style.display = "block";
        }
    });
    questionsload();
</script>

</html>
